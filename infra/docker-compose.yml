name: yamacommerce-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yamacommerce_owner
      POSTGRES_PASSWORD: change-me-in-production
      POSTGRES_DB: yamacommerce
    ports:
      - "5432:5432"
    volumes:
      - yamacommerce_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamacommerce_owner -d yamacommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - yamacommerce_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optionnel — interface d'administration PostgreSQL pour le développement local.
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  yamacommerce_db_data:
  yamacommerce_redis_data:
